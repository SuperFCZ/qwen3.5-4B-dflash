<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="636" viewBox="0 0 1280 636" role="img" aria-labelledby="title desc">
  <title id="title">DFlash Draft：输入、并行候选生成和输出</title>
  <desc id="desc">从左向右读。输入为新提交的 Target 特征、历史上下文 KV，以及 anchor 加 K 个 MASK。特征经共享 FC 和 RMSNorm 后，各层分别投影 K/V，追加到各层上下文缓存并输出更新后的 KV。anchor 和 MASK 经 Target Embedding、6 层 Draft Attention 与 MLP、最终 RMSNorm；仅 MASK 行通过 Target LM head 和 Top1，输出 K 个候选 token。每层 Attention 读取上下文 KV 和本轮 block 的临时 KV；Q 仅来自 block。Verify 和接受后的提交不在 Draft 内部。</desc>
  <!-- Original drawing, informed by Figure 2 of https://arxiv.org/abs/2602.06036.
       Dimensions and state interfaces follow this repository's Qwen3.5-4B implementation. -->
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878a3"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#238052"/></marker>
    <style>
      text { font-family: "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172b3a; font-size: 18px; }
      .heading { font-size: 22px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; fill: #475e70; }
      .tiny { font-size: 13px; fill: #475e70; }
      .center { text-anchor: middle; }
      .blue { fill: #eaf5fc; stroke: #79b3d2; stroke-width: 1.5; }
      .green { fill: #eaf8ef; stroke: #79b995; stroke-width: 1.5; }
      .blue-line { fill: none; stroke: #2878a3; stroke-width: 2.5; marker-end: url(#blue-arrow); stroke-linejoin: round; }
      .green-line { fill: none; stroke: #238052; stroke-width: 2.5; marker-end: url(#green-arrow); stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1280" height="636" rx="16" fill="#fff"/>
  <text x="24" y="43" class="heading">输入</text>
  <text x="315" y="43" class="heading">Draft：一次前向，并行生成候选</text>
  <text x="1028" y="43" class="heading">输出</text>
  <path d="M24 65 H1256" stroke="#dce4eb"/>
  <rect x="296" y="86" width="704" height="505" rx="18" fill="#f8fafc" stroke="#cbd5df" stroke-dasharray="7 5"/>

  <!-- Context path: shared feature fusion, then a separate K/V pair per layer. -->
  <rect x="24" y="117" width="244" height="112" rx="12" class="blue"/>
  <text x="40" y="150" class="label">① 新增 Target 特征</text>
  <text x="40" y="181" class="small">来自已提交的 Target 位置</text>
  <text x="40" y="210" class="small">每 token：8 × 2560 维</text>

  <rect x="315" y="145" width="153" height="70" rx="10" class="blue"/>
  <text x="391.5" y="173" class="center" font-size="16">FC → RMSNorm</text>
  <text x="391.5" y="201" class="small center">20480 → 2560</text>
  <path d="M268 180 H315" class="blue-line"/>

  <rect x="503" y="132" width="190" height="95" rx="10" class="blue"/>
  <text x="598" y="160" class="label center">各层独立投影 K/V</text>
  <text x="598" y="187" class="small center">K：Norm + RoPE</text>
  <text x="598" y="211" class="small center">V：线性投影</text>
  <path d="M468 180 H503" class="blue-line"/>

  <rect x="738" y="132" width="243" height="111" rx="10" class="blue"/>
  <text x="859.5" y="161" class="label center">追加到上下文 KV</text>
  <text x="859.5" y="187" class="small center">每个 Draft 层各一份</text>
  <text x="859.5" y="214" class="small center">6 层 × (K, V)</text>
  <path d="M693 180 H738" class="blue-line"/>

  <rect x="24" y="268" width="244" height="82" rx="12" class="blue"/>
  <text x="40" y="299" class="label">② 历史上下文 KV</text>
  <text x="40" y="328" class="small">首轮为空，后续复用</text>
  <path d="M268 310 H711 V213 H738" class="blue-line"/>

  <rect x="1028" y="132" width="228" height="111" rx="12" class="blue"/>
  <text x="1044" y="161" class="label">更新后的上下文 KV</text>
  <text x="1044" y="187" class="small">只含已提交上下文</text>
  <text x="1044" y="214" class="small">留给下一轮 Draft</text>
  <path d="M981 180 H1028" class="blue-line"/>

  <text x="623" y="380" class="small">上下文 KV 供 6 层分别读取</text>

  <!-- Token path: the entire anchor/MASK block traverses six decoder layers. -->
  <rect x="24" y="426" width="244" height="126" rx="12" class="green"/>
  <text x="40" y="455" class="label">③ anchor + MASK 块</text>
  <g class="center">
    <rect x="40" y="472" width="59" height="33" rx="6" fill="#ffe7a5" stroke="#d6a23d"/>
    <text x="69.5" y="494" class="tiny">anchor</text>
    <rect x="106" y="472" width="50" height="33" rx="6" fill="#ccefd7"/>
    <text x="131" y="494" class="tiny">MASK</text>
    <rect x="163" y="472" width="50" height="33" rx="6" fill="#ccefd7"/>
    <text x="188" y="494" class="tiny">MASK</text>
    <text x="235" y="495">…</text>
  </g>
  <text x="40" y="536" class="small">K 个 MASK，1 ≤ K ≤ 15</text>

  <rect x="315" y="453" width="153" height="84" rx="10" class="green"/>
  <text x="391.5" y="478" class="center">Target</text>
  <text x="391.5" y="503" class="center">Embedding</text>
  <text x="391.5" y="525" class="small center">共享权重，FP16</text>
  <path d="M268 495 H315" class="green-line"/>

  <rect x="500" y="425" width="249" height="127" rx="12" fill="#d8efdf" stroke="#79b995"/>
  <rect x="515" y="453" width="118" height="84" rx="8" fill="#fff" stroke="#79b995"/>
  <text x="574" y="479" class="center">Attention</text>
  <text x="574" y="503" class="tiny center">Q 来自 block</text>
  <text x="574" y="525" class="tiny center">含临时 block KV</text>
  <rect x="660" y="453" width="73" height="84" rx="8" fill="#fff" stroke="#79b995"/>
  <text x="696.5" y="486" class="center">MLP</text>
  <text x="696.5" y="514" class="small center">残差</text>
  <path d="M468 495 H515" class="green-line"/>
  <path d="M633 495 H660" class="green-line"/>
  <text x="624.5" y="577" class="label center">Draft 层 × 6</text>

  <rect x="773" y="426" width="208" height="134" rx="10" class="green"/>
  <text x="877" y="454" class="center">最终 RMSNorm</text>
  <text x="877" y="483" class="label center">仅取 MASK 行</text>
  <text x="877" y="512" class="center">Target LM head</text>
  <text x="877" y="541" class="small center">全词表 Top1</text>
  <path d="M733 495 H773" class="green-line"/>

  <rect x="1028" y="426" width="228" height="126" rx="12" class="green"/>
  <text x="1044" y="455" class="label">K 个候选 token</text>
  <g class="center">
    <rect x="1050" y="472" width="49" height="33" rx="6" fill="#ccefd7"/>
    <text x="1074.5" y="495">A</text>
    <rect x="1115" y="472" width="49" height="33" rx="6" fill="#ccefd7"/>
    <text x="1139.5" y="495">B</text>
    <rect x="1180" y="472" width="49" height="33" rx="6" fill="#ccefd7"/>
    <text x="1204.5" y="495">…</text>
  </g>
  <text x="1044" y="536" class="small">送 Chunk / MTP Verify</text>
  <path d="M981 495 H1028" class="green-line"/>
  <text x="1044" y="580" class="small">anchor 不重复输出为候选</text>
  <path d="M860 243 V352 H574 V453" class="blue-line"/>

  <rect x="24" y="609" width="13" height="13" rx="2" fill="#79b3d2"/>
  <text x="46" y="621" class="small">上下文 / 持久状态</text>
  <rect x="228" y="609" width="13" height="13" rx="2" fill="#79b995"/>
  <text x="250" y="621" class="small">本轮并行候选路径</text>
  <rect x="432" y="609" width="13" height="13" rx="2" fill="#ffe7a5" stroke="#d6a23d"/>
  <text x="454" y="621" class="small">已由 Target 给出的 anchor</text>
</svg>
